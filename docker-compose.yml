version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: rupiah-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rupiah_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.5.0
    container_name: rupiah-dbt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_POSTGRES_HOST: postgres
      DBT_POSTGRES_USER: postgres
      DBT_POSTGRES_PASS: postgres
      DBT_POSTGRES_PORT: 5432
      DBT_POSTGRES_DBNAME: rupiah_db
      DBT_POSTGRES_SCHEMA: analytics
    volumes:
      - ./dbt:/dbt
      - ./logs:/dbt/logs
    working_dir: /dbt
    command: tail -f /dev/null

volumes:
  postgres_data: