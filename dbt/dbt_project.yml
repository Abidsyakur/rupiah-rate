name: 'rupiah_exchange'
version: '1.0.0'
config-version: 2

# dbt Cloud / CLI profile (matches profiles.yml)
profile: 'rupiah'

# Model file paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Artifacts
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# -----------------------------------------------------------------------
# Model configuration by layer
# -----------------------------------------------------------------------
models:
  rupiah_exchange:

    staging:
      # Staging models are views — cheap to rebuild, always fresh
      +materialized: view
      +schema: staging
      +tags: ["staging"]

    intermediate:
      # Intermediate models are tables — heavier transforms, cached
      +materialized: table
      +schema: intermediate
      +tags: ["intermediate"]

    marts:
      # Mart models are tables — consumed by Airflow, dashboards, dbt tests
      +materialized: table
      +schema: marts
      +tags: ["marts"]

# -----------------------------------------------------------------------
# Variable defaults (override in profiles.yml or CLI --vars)
# -----------------------------------------------------------------------
vars:
  # Minimum data quality score to include a rate record in staging
  min_quality_score: 0.0

  # Maximum age (hours) before a rate record is considered stale
  freshness_threshold_hours: 48

  # True = include records with is_valid=False (for audit/debug models)
  include_invalid_records: false