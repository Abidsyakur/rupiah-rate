name: 'rupiah_exchange_rate'
version: '1.0.0'
config-version: 2

profile: 'rupiah'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  start_date: '2025-01-01'
  end_date: '2025-12-31'
  quality_threshold: 0.7

models:
  rupiah_exchange_rate:
    staging:
      materialized: view
      tags: ["staging"]
    intermediate:
      materialized: table
      tags: ["intermediate"]
    marts:
      materialized: table
      tags: ["marts"]