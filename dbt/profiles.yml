rupiah:
  target: dev
  outputs:
    dev:
      type: postgres
      host: rupiah-postgres
      user: postgres
      password: postgres
      port: 5432
      dbname: rupiah_db
      schema: analytics
      threads: 4
      keepalives_idle: 0
    
    prod:
      type: postgres
      host: localhost
      user: postgres
      password: postgres
      port: 5432
      dbname: rupiah_prod
      schema: analytics
      threads: 8
      keepalives_idle: 0