version: 2

# -----------------------------------------------------------------------
# dbt/seeds/schema.yml
# -----------------------------------------------------------------------
# Documentation and tests for seed files (static reference data loaded
# via `dbt seed`).
# -----------------------------------------------------------------------

seeds:

  - name: currencies
    description: >
      Reference currency data, used to seed/cross-check the currencies
      dimension. Mirrors the currency pairs supported by
      src/etl/extractors.py (YFINANCE_TICKER_MAP) — IDR is the platform's
      base/quote currency; the remaining six are the tracked trading
      partners.

      This seed is NOT the source of truth for production currency_id
      values (those come from the currencies table populated by Alembic
      migration 001_initial_schema.py). It exists for:
        - local/dev environment bootstrapping without a full DB migration
        - regression testing region/role classification logic in
          dim_currencies.sql against a known-good reference set
    config:
      column_types:
        currency_code: varchar(3)
        currency_name: varchar(255)
        region: varchar(50)
        is_active: boolean
    columns:
      - name: currency_code
        description: ISO 4217 three-letter code.
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['IDR', 'USD', 'EUR', 'GBP', 'JPY', 'SGD', 'AUD']
      - name: currency_name
        tests: [not_null]
      - name: region
        tests: [not_null]
      - name: is_active
        tests: [not_null]