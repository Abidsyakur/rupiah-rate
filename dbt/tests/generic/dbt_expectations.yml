version: 2

# =============================================================================
# tests/generic/dbt_expectations.yml (DOCUMENTATION ONLY)
# =============================================================================
# Centralised REFERENCE for dbt_expectations tests used across this project.
#
# IMPORTANT: This file documents WHICH dbt_expectations tests are applied
# where, but does NOT define them. All actual test declarations live in
# each model's own schema.yml for proper dbt docs rendering.
#
# Requires the dbt_expectations package — add to packages.yml:
#
#   packages:
#     - package: calogica/dbt_expectations
#       version: [">=0.10.0", "<0.11.0"]
#
# Apply these tests directly in each model's schema.yml, e.g.:
#
#   models:
#     - name: stg_exchange_rates
#       columns:
#         - name: rate
#           tests:
#             - dbt_expectations.expect_column_values_to_be_between:
#                 min_value: 0.01
#                 max_value: 1000000
#                 strictly: true
# =============================================================================

